name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ch32v307
            mcu_name: CH32V307VC
          - target: ch32v317
            mcu_name: CH32V317WCU6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install scons
        run: python3 -m pip install scons

      - name: Install mergehex-rs
        # root configure requires mergehex-rs (custom.cmake FATAL_ERRORs when absent)
        run: cargo install --git https://github.com/kaidegit/mergehex-rs

      - name: Download RISC-V toolchain
        run: |
          curl -sSL -o riscv32-wch-elf-gcc-15.tar.xz \
            https://github.com/kaidegit/wchrv-toolchain/releases/download/2026-8-4/riscv32-wch-elf-gcc-15.tar.xz
          mkdir -p toolchain
          tar -xf riscv32-wch-elf-gcc-15.tar.xz -C toolchain
          TC_BIN="$(cd "$(dirname "$(find toolchain -name riscv32-wch-elf-gcc -type f | head -1)")" && pwd)"
          echo "RTT_EXEC_PATH=$TC_BIN" >> "$GITHUB_ENV"
          echo "$TC_BIN" >> "$GITHUB_PATH"

      - name: Generate CMakeLists.txt
        run: scons --target=cmake

      - name: Configure CMake
        run: >-
          cmake -S . -B build-${{ matrix.target }}
          -DCMAKE_BUILD_TYPE=Debug
          -DWLH_TARGET=${{ matrix.target }}

      - name: Build app and merged firmware
        # flash_all also flashes via wlink (needs hardware), so only build merge_hex
        run: >-
          cmake --build build-${{ matrix.target }}
          --target merge_hex --parallel

      - name: Verify target identity
        run: >-
          strings build-${{ matrix.target }}/wlhosted-${{ matrix.target }}.elf
          | grep -F "${{ matrix.mcu_name }}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wlhosted-${{ matrix.target }}-firmware
          path: |
            build-${{ matrix.target }}/wlhosted-${{ matrix.target }}-all.hex
            build-${{ matrix.target }}/wlhosted-${{ matrix.target }}.hex
            build-${{ matrix.target }}/wlhosted-${{ matrix.target }}.elf
          if-no-files-found: error
