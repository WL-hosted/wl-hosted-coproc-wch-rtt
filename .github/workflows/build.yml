name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install scons
        run: python3 -m pip install scons

      - name: Install mergehex-rs
        # root configure requires mergehex-rs (custom.cmake FATAL_ERRORs when absent)
        run: cargo install --git https://github.com/kaidegit/mergehex-rs

      - name: Download RISC-V toolchain
        run: |
          curl -sSL -o riscv32-wch-elf-gcc-15.tar.xz \
            https://github.com/kaidegit/wchrv-toolchain/releases/download/2026-8-4/riscv32-wch-elf-gcc-15.tar.xz
          mkdir -p toolchain
          tar -xf riscv32-wch-elf-gcc-15.tar.xz -C toolchain
          TC_BIN="$(cd "$(dirname "$(find toolchain -name riscv32-wch-elf-gcc -type f | head -1)")" && pwd)"
          echo "RTT_EXEC_PATH=$TC_BIN" >> "$GITHUB_ENV"
          echo "$TC_BIN" >> "$GITHUB_PATH"

      - name: Generate CMakeLists.txt
        run: scons --target=cmake

      - name: Configure CMake
        run: cmake -S . -B build-debug -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-debug --parallel

      - name: Build bl_s1 (stage-1 bootloader)
        run: |
          cmake -S bl_s1 -B bl_s1/build-debug -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_ASM_COMPILER="$RTT_EXEC_PATH/riscv32-wch-elf-gcc" \
            -DCMAKE_OBJCOPY="$RTT_EXEC_PATH/riscv32-wch-elf-objcopy" \
            -DCMAKE_SIZE="$RTT_EXEC_PATH/riscv32-wch-elf-size"
          cmake --build bl_s1/build-debug --parallel

      - name: Build bl_s2 (stage-2 bootloader)
        run: |
          cmake -S bl_s2 -B bl_s2/build-debug -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER="$RTT_EXEC_PATH/riscv32-wch-elf-gcc" \
            -DCMAKE_ASM_COMPILER="$RTT_EXEC_PATH/riscv32-wch-elf-gcc" \
            -DCMAKE_AR="$RTT_EXEC_PATH/riscv32-wch-elf-ar" \
            -DCMAKE_RANLIB="$RTT_EXEC_PATH/riscv32-wch-elf-ranlib" \
            -DCMAKE_OBJCOPY="$RTT_EXEC_PATH/riscv32-wch-elf-objcopy" \
            -DCMAKE_SIZE="$RTT_EXEC_PATH/riscv32-wch-elf-size"
          cmake --build bl_s2/build-debug --parallel

      - name: Merge bl_s1 + rtthread + bl_s2 into wlhosted_all.hex
        # flash_all also flashes via wlink (needs hardware), so only build merge_hex
        run: cmake --build build-debug --target merge_hex --parallel

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtthread-firmware
          path: |
            build-debug/wlhosted_all.hex
            build-debug/rtthread.hex
            build-debug/rtthread.elf
          if-no-files-found: error
